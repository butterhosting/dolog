include:
  - compose-deps.yaml

services:
  application:
    image: butterhosting/dolog:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # the socket is root:<group> 0660, so a non-root user only gets in through its group
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./opt:/app/opt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 1s
      timeout: 10s
      retries: 10
    depends_on:
      trickle:
        condition: service_started
      firehose:
        condition: service_started
      webhooks:
        condition: service_healthy
