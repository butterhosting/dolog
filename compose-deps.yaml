services:
  trickle:
    image: alpine
    container_name: trickle
    cpus: "0.1"
    mem_limit: 12m
    restart: unless-stopped
    attach: false
    # a shell loop ignores SIGTERM, and the e2e run does not wait the default ten seconds for it
    stop_grace_period: 100ms
    labels:
      dolog.alerting.text-pattern: '" 500 '
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i + 1))
          case $$((i % 6)) in
            0) m=GET;    p=/ ;;
            1) m=GET;    p=/health ;;
            2) m=POST;   p=/api/orders ;;
            3) m=GET;    p=/api/orders/8821 ;;
            4) m=PUT;    p=/assets/app.css ;;
            *) m=DELETE; p=/login ;;
          esac
          case $$(((i * 3) % 10)) in
            5) c=201 ;;
            6) c=304 ;;
            7) c=404 ;;
            8) c=500 ;;
            *) c=200 ;;
          esac
          echo "$$(date -u +%H:%M:%S) \"$$m $$p\" $$c $$(((i * 37) % 400 + 3))ms"
          sleep 0.2
        done

  firehose:
    image: alpine
    container_name: firehose
    cpus: "0.1"
    mem_limit: 12m
    restart: unless-stopped
    attach: false
    stop_grace_period: 100ms
    # ~400 lines a second, comfortably over the custom budget of 150 so the throttler has to fold
    # and over the throughput threshold too, which alerts the `webhooks` container once a minute
    labels:
      dolog.throttling.logs-per-second: 150
      dolog.alerting.throughput-threshold: 300
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          j=0
          while [ $$j -lt 200 ]; do
            i=$$((i + 1))
            j=$$((j + 1))
            echo "burst line $$i"
          done
          sleep 0.5
        done

  webhooks:
    image: oven/bun:alpine
    container_name: webhooks
    restart: unless-stopped
    networks:
      - app-network
    stop_grace_period: 100ms
    ports:
      - "3001:3001"
    command:
      - bun
      - -e
      - |
        const received = [];
        Bun.serve({
          port: 3001,
          async fetch(request) {
            const { pathname } = new URL(request.url);
            if (request.method === "POST") {
              const body = await request.json();
              received.push(body);
              console.log(request.method, pathname, body);
            }
            if (request.method === "GET" && pathname === "/received") {
              return Response.json(received);
            }
            return new Response(null, { status: 204 });
          },
        });
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/ || exit 1"]
      interval: 1s
      timeout: 10s
      retries: 10

networks:
  app-network:
    driver: bridge
