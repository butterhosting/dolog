on:
  push:
    branches:
      - main
    tags:
      - "*"

env:
  BUN_VERSION: "1.3.8"
  NODE_MAJOR_VERSION: "24"
  DOCKER_IMAGE: "butterhosting/dolog"

jobs:
  ci:
    name: "CI Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: "Environment :: Checkout"
        uses: actions/checkout@v6

      - name: "Environment :: Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: "Environment :: Node"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_MAJOR_VERSION }}

      - name: "Setup :: Installation"
        run: |
          bun install
          bun install:browsers

      - name: "Application :: Type Checking"
        run: bun tc

      - name: "Application :: Linting"
        run: bun lint

      - name: "Application :: Unit Tests"
        run: bun test:unit

      - name: "Application :: Deployment Tests"
        run: bun test:deployment

      - name: "Application :: E2E Tests"
        run: bun e2e:headless

  cd:
    name: "CD Pipeline"
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: ci
    steps:
      - name: "Environment :: Checkout"
        uses: actions/checkout@v6

      - name: "Image :: Build"
        run: ./dolog image create

      # a prerelease (1.0.0-alpha.1) does not become `latest`
      - name: "Image :: Tag"
        run: |
          docker tag "dolog:${GITHUB_REF_NAME}" "${DOCKER_IMAGE}:${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) docker tag "dolog:${GITHUB_REF_NAME}" "${DOCKER_IMAGE}:latest" ;;
          esac

      - name: "Docker Hub :: Login"
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: printf "%s" "$DOCKER_HUB_TOKEN" | docker login --username "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: "Docker Hub :: Push"
        run: docker push --all-tags "${DOCKER_IMAGE}"
