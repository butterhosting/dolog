on:
  push:
    branches:
      - main
    tags:
      - "*"

env:
  BUN_VERSION: "1.3.8"
  NODE_MAJOR_VERSION: "24"

jobs:
  ci:
    name: "CI Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: "Environment :: Checkout"
        uses: actions/checkout@v6

      - name: "Environment :: Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: "Environment :: Node"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_MAJOR_VERSION }}

      - name: "Setup :: Installation"
        run: |
          bun install
          bun install:browsers

      - name: "Application :: Type Checking"
        run: bun tc

      - name: "Application :: Linting"
        run: bun lint

      - name: "Application :: Unit Tests"
        run: bun test:unit

      - name: "Application :: Deployment Tests"
        run: bun test:deployment

      - name: "Application :: E2E Tests"
        run: bun e2e:headless

      - name: "Application :: E2E Report"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/.playwright-report
            e2e/.test-results
          # both are dot-directories, which the action leaves out unless told otherwise
          include-hidden-files: true
          retention-days: 3

  cd:
    name: "CD Pipeline"
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: ci
    steps:
      - name: "Environment :: Checkout"
        uses: actions/checkout@v6

      - name: "Environment :: QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Environment :: Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Docker Hub :: Login"
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: printf "%s" "$DOCKER_HUB_TOKEN" | docker login --username "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: "Image :: Publish"
        run: ./image.sh publish
