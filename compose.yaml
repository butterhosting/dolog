# `bun dev`. Brings up the app and the containers it watches together, so there is never a moment
# where the log viewer is running with nothing to show.
include:
  - compose-containers.yaml

services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    command: bun start:dev
    ports:
      - "3000:3000"
    volumes:
      # the source, so `--hot` reloads on an edit the same as it does outside a container
      - .:/app
      # keep the image's own install rather than letting the host's shadow it
      - /app/node_modules
      # what dolog is *for*: the socket it reads containers and their logs from
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    stop_grace_period: 100ms
    depends_on:
      - gateway
      - firehose
