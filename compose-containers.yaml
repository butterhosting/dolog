# Two containers to point dolog at while developing. Between them they cover the two things the
# viewer has to get right: a log slow enough to read, and one fast enough to be throttled.
#
# `$` is doubled throughout because compose expands it before the shell ever sees it.
#
# Both carry `attach: false`: the daemon still records every line, so dolog reads them off the
# socket as usual, compose just stops mirroring them into the terminal running `bun dev`.
# `docker compose logs gateway` still prints them on demand.
services:
  gateway:
    image: alpine
    container_name: trickle
    restart: unless-stopped
    attach: false
    # a line a second, deterministic rather than random so a run reads the same twice
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i + 1))
          case $$((i % 6)) in
            0) m=GET;    p=/ ;;
            1) m=GET;    p=/health ;;
            2) m=POST;   p=/api/orders ;;
            3) m=GET;    p=/api/orders/8821 ;;
            4) m=PUT;    p=/assets/app.css ;;
            *) m=DELETE; p=/login ;;
          esac
          case $$(((i * 3) % 10)) in
            5) c=201 ;;
            6) c=304 ;;
            7) c=404 ;;
            8) c=500 ;;
            *) c=200 ;;
          esac
          echo "$$(date -u +%H:%M:%S) \"$$m $$p\" $$c $$(((i * 37) % 400 + 3))ms"
          sleep 1
        done

  firehose:
    image: alpine
    container_name: firehose
    restart: unless-stopped
    attach: false
    # ~400 lines a second, comfortably over the default budget of 100 so the throttler has to fold
    # it -- bursty rather than a flat-out spin loop, which would pin a core for no extra coverage
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          j=0
          while [ $$j -lt 200 ]; do
            i=$$((i + 1))
            j=$$((j + 1))
            echo "burst line $$i"
          done
          sleep 0.5
        done
